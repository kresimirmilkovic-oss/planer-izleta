function useHistory(init){
  const [h,setH]=useState({past:[],present:init,future:[]});
  const commit=useCallback(fn=>setH(c=>{const n=typeof fn==='function'?fn(c.present):fn;if(!n||n===c.present)return c;return{past:[...c.past,c.present].slice(-80),present:n,future:[]};}),[]);
  const undo=useCallback(()=>setH(c=>c.past.length?{past:c.past.slice(0,-1),present:c.past[c.past.length-1],future:[c.present,...c.future]}:c),[]);
  const redo=useCallback(()=>setH(c=>c.future.length?{past:[...c.past,c.present],present:c.future[0],future:c.future.slice(1)}:c),[]);
  return{state:h.present,canUndo:h.past.length>0,canRedo:h.future.length>0,commit,undo,redo};
}

function RouteWidget({sched,sel,onSelect,trip}){
  if(!sched.length)return html`<p class="text-sm text-muted">Ruta će se pojaviti kad dodaš lokacije.</p>`;

  const sx=Math.max(maxx-minx,.2),sy=Math.max(maxy-miny,.2),k=Math.min((W-2*Pd)/sx,(H-2*Pd)/sy);
  const ox=(W-sx*k)/2,oy=(H-sy*k)/2;
  const pt=s=>[ox+(s.x-minx)*k+(maxx===minx?(sx*k)/2-.1*k:0),H-(oy+(s.y-miny)*k)-(maxy===miny?-(sy*k)/2+.1*k:0)];

          <circle cx=${pts[i][0]} cy=${pts[i][1]} r="11" style=${{fill:CATS[s.cat].color,stroke:'var(--card)'}} strokeWidth="2.5"/>
          <text x=${pts[i][0]} y=${pts[i][1]+3.5} textAnchor="middle" fontSize="10" fontWeight="800" style=${{fill:'#fff'}}>${i+1}</text>
        </g>`)}
      </svg>
    </div>
    <div class="mt-2 flex items-center justify-between text-xs text-muted font-semibold"><span>Ukupno oko ${fmtKm(km)}</span><span>Dodirni točku za odabir</span></div>
    ${routeLink(sched,trip)&&html`<a class=${btn+' mt-3 w-full h-10'} href=${routeLink(sched,trip)} target="_blank" rel="noopener"><${Icon} name="nav" size=${14}/>Otvori cijelu rutu u Google Kartama</a>`}
    ${selS&&html`<div class="mt-2 rounded-xl border border-line px-3 py-2 text-sm"><b>${sched.indexOf(selS)+1}. ${selS.name}</b><div class="text-xs text-muted tnum">${fmtT(selS.start)}–${fmtT(selS.end)}${selS.district?' · '+selS.district:''}</div></div>`}
  </div>`;
}

    delay:(id,m)=>{upd(a=>a.map(s=>s.id===id?{...s,delay:(s.delay||0)+m}:s));notify(find(id).name+' – odgođeno za '+fmtD(m)+', sljedeće lokacije su pomaknute.');},
    clearDelay:id=>upd(a=>a.map(s=>s.id===id?{...s,delay:0}:s)),
    adjust:(id,m)=>upd(a=>a.map(s=>s.id===id?{...s,duration:clamp(s.duration+m,5,600)}:s)),
    move:(from,to)=>{if(to<0||to>=stops.length||from===to)return;upd(a=>{const b=a.slice();const [x]=b.splice(from,1);b.splice(to,0,x);return b;});},
    alt:id=>{const s=find(id);const n=nextAlternative(s,st);if(!n)return notify('Za ovu kategoriju nema više alternativa.',false);upd(a=>a.map(x=>x.id===id?n:x));notify('Zamijenjeno: '+n.name);},
    later:id=>{const s=find(id);H.commit(o=>({...o,days:o.days.map((a,i)=>i===d?a.filter(x=>x.id!==id):a),later:[...o.later,{...s,delay:0}]}));notify(s.name+' – premješteno u Za kasnije.');},
    dup:id=>{upd(a=>{const i=a.findIndex(x=>x.id===id);const b=a.slice();b.splice(i+1,0,{...a[i],id:uid(),delay:0});return b;});notify('Lokacija je duplicirana.');},
    remove:id=>{const s=find(id);upd(a=>a.filter(x=>x.id!==id));if(editing===id)setEditing(null);notify(s.name+' – uklonjeno iz plana.');},
    nextDay:id=>{const s=find(id);H.commit(o=>({...o,days:o.days.map((a,i)=>i===d?a.filter(x=>x.id!==id):i===d+1?[...a,{...s,delay:0}]:a)}));notify(s.name+' – prebačeno na '+(d+2)+'. dan.');},
    edit:id=>{setEditing(id);setSel(id);},
    cancelEdit:()=>setEditing(null),
    save:(id,p)=>{upd(a=>a.map(s=>s.id===id?{...s,...p}:s));setEditing(null);},
  };
  const restore=id=>{const s=st.later.find(x=>x.id===id);if(!st.days.length)return;H.commit(o=>({...o,later:o.later.filter(x=>x.id!==id),days:o.days.map((a,i)=>i===d?[...a,s]:a)}));setTab('plan');setSel(id);scrollTo(id);notify(s.name+' – vraćeno u plan.');};
  const dropLater=id=>{H.commit(o=>({...o,later:o.later.filter(x=>x.id!==id)}));notify('Trajno uklonjeno.');};
  const insert=stop=>{const i=addAt==null?stops.length:addAt;upd(a=>{const b=a.slice();b.splice(i,0,stop);return b;});setAddAt(null);setSel(stop.id);scrollTo(stop.id);notify(stop.name+' – dodano u plan.');};
  const selectFromSide=id=>{setSel(id);setTab('plan');scrollTo(id);};
  const remoteOk=aiOk||(apiCfg.provider!=='none'&&!!apiCfg.key);
  const engineLabel=aiOk?'Ugrađeni pomoćnik + Claude':remoteOk?'Ugrađeni pomoćnik + '+(apiCfg.provider==='anthropic'?'Anthropic':'OpenAI'):'Ugrađeni pomoćnik – radi i bez interneta';
  const runCopilot=async text=>{
    setCpLog(l=>[...l,{role:'user',text}]);setCpBusy(true);const say=(t,changed)=>setCpLog(l=>[...l.map(m=>({...m,changed:false})),{role:'bot',text:t,changed:!!changed}]);
    try{
      const r=await localEngine(text,st,d);
      if(r&&r.undo){H.undo();say(r.reply);return;}
      if(r){H.commit(()=>r.state);setEditing(null);say(r.reply||'Plan je ažuriran.',true);return;}
      if(remoteOk){const prompt=buildRemotePrompt(text,st,d);const res=aiOk?await (await getSample()).json(prompt,{modelTier:'default'}):parseJsonText(await callByok(apiCfg,prompt));
        const ns=applyRemote(res,st,d);H.commit(()=>ns);setEditing(null);say(str(res.reply,600)||'Plan je ažuriran.',true);return;}
      say('Nisam siguran što trebam napraviti. Probaj npr. „Dodaj još jedan muzej”, „Odgodi sve za 1 sat”, „Makni zadnju lokaciju” ili „Prebaci sve na pješačenje”. Za slobodnije zahtjeve u Postavkama možeš dodati vlastiti API ključ.');
    }catch(e){say('Izmjena nije uspjela ('+((e&&e.code==='not_granted')?'pristup Claudeu nije odobren':(e&&(e.message||e.code))||'nepoznata greška')+'). Plan je ostao nepromijenjen.');}
    finally{setCpBusy(false);}
  };
  const clearCities=()=>{Object.keys(AI).forEach(k=>delete AI[k]);saveAI();Object.keys(GEO).forEach(k=>delete GEO[k]);try{localStorage.removeItem(GEO_KEY);}catch(e){}poolCache.clear();setCityCount(0);notify('Spremljeni gradovi su obrisani.',false);};
  const dayLabel=st.days.length>1?(d+1)+'. dan':'plan';
  const tripEnd=st.trip.end;
  const cur=st.trip.currency||'EUR';
  const setCurrency=k=>H.commit(s=>({...s,trip:{...s.trip,currency:k}}));

  const widgetBody=id=>{
    if(id==='budget')return html`<${BudgetWidget} st=${st} cur=${cur} onBudget=${b=>H.commit(s=>({...s,trip:{...s.trip,budget:b}}))}/>`;
    if(id==='summary')return html`<${SummaryWidget} sched=${sched} trip=${st.trip} sel=${sel} onSelect=${selectFromSide}/>`;
    if(id==='route')return html`<${RouteWidget} sched=${sched} sel=${sel} onSelect=${selectFromSide} trip=${st.trip}/>`;
    if(id==='later')return html`<${LaterWidget} later=${st.later} onRestore=${restore} onDrop=${dropLater} dayLabel=${dayLabel}/>`;
    return html`<${ContextWidget} trip=${st.trip} check=${check} setCheck=${setCheck}/>`;
  };
  const overCount=sched.filter(s=>s.over).length;

  return html`<div class="min-h-screen bg-bg text-ink">
    <header class="sticky z-30 border-b border-line bg-card" style=${{top:'env(safe-area-inset-top,0px)'}}>
      <div class="max-w-6xl mx-auto px-4 sm:px-6 h-14 flex items-center gap-2">
        <div class="flex items-center gap-2 min-w-0 flex-1">
          <span class="h-8 w-8 grid place-items-center rounded-lg bg-brand text-onbrand shrink-0"><${Icon} name="map" size=${17}/></span>
          <span class="font-extrabold tracking-tight truncate">Planer izleta</span>
        </div>
        <button class=${btn+' h-9 w-9 px-0'} onClick=${()=>setSettingsOpen(true)} aria-label="Postavke" title="Postavke"><${Icon} name="gear" size=${16}/></button>
        ${st.generated&&html`<label class="relative"><span class="sr-only">Valuta</span><select class=${btn+' h-9 pl-2.5 pr-6 appearance-none cursor-pointer'} value=${cur} onChange=${e=>setCurrency(e.target.value)}>${CUR_KEYS.map(k=>html`<option key=${k} value=${k}>${CURRENCIES[k].label}</option>`)}</select><span class="pointer-events-none absolute right-1.5 top-1/2 -translate-y-1/2 text-muted"><${Icon} name="chevDown" size=${12}/></span></label>`}
        <button class=${btn+' h-9'} onClick=${H.undo} disabled=${!H.canUndo} title="Poništi (Ctrl+Z)"><${Icon} name="undo" size=${15}/><span class="hidden sm:inline">Poništi</span></button>
        <button class=${btn+' h-9'} onClick=${H.redo} disabled=${!H.canRedo} title="Ponovi (Ctrl+Shift+Z)"><${Icon} name="redo" size=${15}/><span class="hidden sm:inline">Ponovi</span></button>
        ${st.generated&&html`<button class=${btn+' h-9 bg-brand text-onbrand border-brand hover:bg-brand hover:opacity-90'} onClick=${()=>setExportOpen(true)}><${Icon} name="share" size=${15}/><span class="hidden sm:inline">Izvezi / podijeli</span></button>`}
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 pb-28">
      ${(!st.generated||setupOpen)&&html`<${SetupPanel} key=${'setup'+(setupOpen?1:0)} initial=${st.trip} hasPlan=${st.generated} onCancel=${()=>setSetupOpen(false)} aiOk=${aiOk} onGenerate=${t=>startGenerate(t,false)}/>`}
      ${st.generated&&!setupOpen&&html`<${TripBar} st=${st} onAi=${(aiOk||live)&&!findCity(st.trip.destination)?()=>startGenerate(st.trip,false):null} onEdit=${()=>setSetupOpen(true)} onRegenerate=${()=>{generate(st.trip,true);notify('Složen je novi prijedlog plana.');}} onMode=${m=>H.commit(s=>({...s,trip:{...s.trip,mode:m}}))}/>`}

      ${st.generated&&html`<div>
        <div class="lg:hidden mt-4 grid grid-cols-2 gap-1 p-1 rounded-xl bg-soft">
          ${[['plan','Plan'],['overview','Karta i pregled']].map(([k,l])=>html`<button key=${k} class=${'h-10 rounded-lg text-sm font-bold transition '+(tab===k?'bg-card shadow-card':'text-muted')} onClick=${()=>setTab(k)}>${l}${k==='overview'&&st.later.length>0?html`<span class="ml-1.5 inline-grid place-items-center h-5 min-w-[20px] px-1 rounded-full bg-brandsoft text-brand text-[11px]">${st.later.length}</span>`:''}</button>`)}
        </div>
        <div class="mt-5 grid gap-6 lg:grid-cols-[minmax(0,65fr)_minmax(0,35fr)] items-start">
          <section class=${tab==='plan'?'block':'hidden lg:block'} aria-label="Raspored">
            ${st.days.length>1&&html`<div class="-mx-1 px-1 mb-4 flex gap-2 overflow-x-auto pb-1">
              ${st.days.map((a,i)=>html`<button key=${i} onClick=${()=>{setDay(i);setSel(null);setEditing(null);}} class=${'shrink-0 rounded-xl border px-3.5 py-2 text-left transition '+(i===d?'border-brand bg-brandsoft':'border-line bg-card hover:bg-soft')}>
                <div class=${'text-sm font-extrabold '+(i===d?'text-brand':'')}>Dan ${i+1}</div><div class="text-[11px] font-semibold text-muted tnum">${fmtShort(addDays(st.trip.date,i))} · ${a.length} lok.</div>
              </button>`)}
            </div>`}
            ${overCount>0&&html`<div class="mb-4 flex items-start gap-2.5 rounded-2xl border border-line bg-dangersoft px-4 py-3 text-sm text-danger"><span class="mt-0.5"><${Icon} name="alert" size=${17}/></span><span><b>Raspored prelazi planirani kraj u ${tripEnd}.</b> Skrati trajanje, ukloni lokaciju ili je premjesti u Za kasnije.</span></div>`}
            ${sched.length===0?html`<div class="rounded-2xl border border-dashed border-line bg-card px-6 py-10 text-center">
              <div class="mx-auto h-12 w-12 grid place-items-center rounded-2xl bg-soft text-muted"><${Icon} name="pin" size=${22}/></div>
              <p class="mt-3 font-bold">Ovaj dan još nema lokacija</p><p class="mt-1 text-sm text-muted">Dodaj prijedlog ili vlastitu lokaciju, ili vrati nešto iz popisa Za kasnije.</p>
            </div>`:sched.map((s,i)=>html`<${React.Fragment} key=${s.id}>
              ${i>0&&html`<${Connector} travel=${s.travel} cur=${cur} onAdd=${()=>setAddAt(i)}/>`}
              <${StopCard} s=${s} i=${i} count=${sched.length} dayCount=${st.days.length} day=${d} sel=${sel===s.id} editing=${editing===s.id} dragState=${dragState} act=${act} tripEnd=${tripEnd} cur=${cur} dest=${displayName(st.trip.destination)}/>
            <//>`)}
            <button class="mt-4 w-full h-14 rounded-2xl border-2 border-dashed border-line text-sm font-bold text-muted hover:text-brand hover:border-brand transition flex items-center justify-center gap-2" onClick=${()=>setAddAt(stops.length)}><${Icon} name="plus" size=${18}/>Dodaj lokaciju</button>
          </section>

          <aside class=${(tab==='overview'?'block':'hidden lg:block')+' space-y-4 lg:sticky lg:max-h-[calc(100vh-6rem)] lg:overflow-y-auto lg:pb-2'} style=${{top:'calc(env(safe-area-inset-top,0px) + 72px)'}} aria-label="Pregled">
            <div class="flex items-center justify-between"><span class="text-sm font-bold text-muted">Pregled${st.days.length>1?' – '+(d+1)+'. dan':''}</span><button class=${btn} onClick=${()=>setCustomize(c=>!c)}><${Icon} name="sliders" size=${14}/>Prilagodi</button></div>
            ${customize&&html`<${CustomizePanel} widgets=${widgets} setWidgets=${setWidgets} onClose=${()=>setCustomize(false)}/>`}
            ${widgets.filter(w=>w.on).map(w=>html`<${Widget} key=${w.id} id=${w.id} badge=${w.id==='later'?(st.later.length||''):null} collapsed=${!!collapsed[w.id]} onToggle=${()=>setCollapsed(c=>({...c,[w.id]:!c[w.id]}))}>${widgetBody(w.id)}<//>`)}
            ${widgets.every(w=>!w.on)&&html`<p class="text-sm text-muted">Svi su moduli skriveni. Uključi ih preko gumba Prilagodi.</p>`}
          </aside>
        </div>
      </div>`}
    </main>

    ${addAt!=null&&html`<${AddSheet} st=${st} day=${d} index=${addAt} onAdd=${insert} onClose=${()=>setAddAt(null)}/>`}
    ${aiBusy&&html`<div class="fixed inset-0 z-[70] grid place-items-center bg-slate-900/45 px-6" role="status" aria-live="polite">
      <div class="pop w-full max-w-sm rounded-3xl border border-line bg-card p-6 text-center shadow-2xl">
        <div class="mx-auto h-12 w-12 rounded-full border-4 border-line animate-spin" style=${{borderTopColor:'var(--brand)'}}></div>
        <p class="mt-4 font-bold">Tražim stvarne lokacije: ${aiBusy.dest}</p>
        <p class="mt-1 text-sm text-muted">${aiBusy.msg}</p>
        <button class=${btnGhost+' mt-5 w-full'} onClick=${()=>aiBusy.ctl.abort()}>Preskoči i složi okvirni plan</button>
      </div>
    </div>`}
    ${exportOpen&&html`<${ExportSheet} st=${st} onClose=${()=>setExportOpen(false)}/>`}
    ${st.generated&&!copilot&&html`<button class="fixed z-40 right-4 inline-flex items-center gap-2 h-12 pl-4 pr-5 rounded-full bg-brand text-onbrand text-sm font-bold shadow-2xl active:scale-[.97] transition" style=${{bottom:'calc(env(safe-area-inset-bottom,0px) + 18px)'}} onClick=${()=>setCopilot(true)}><${Icon} name="sparkles" size=${18}/>AI asistent</button>`}
    ${copilot&&html`<${CopilotSheet} log=${cpLog} busy=${cpBusy} onRun=${runCopilot} onClose=${()=>setCopilot(false)} onUndo=${()=>{H.undo();setCpLog(l=>[...l.map(m=>({...m,changed:false})),{role:'bot',text:'Poništio sam zadnju izmjenu.'}]);}} engine=${engineLabel+(st.days.length>1?' · '+(d+1)+'. dan':'')}/>`}
    ${settingsOpen&&html`<${SettingsSheet} cfg=${apiCfg} setCfg=${setApiCfg} aiOk=${aiOk} live=${live} setLive=${setLive} cityCount=${cityCount} onClearCities=${clearCities} onClose=${()=>setSettingsOpen(false)}/>`}
    ${toast&&html`<div class="fixed inset-x-0 bottom-0 z-[60] flex justify-center px-4 pointer-events-none" style=${{paddingBottom:'calc(env(safe-area-inset-bottom,0px) + '+(st.generated?84:16)+'px)'}}>
      <div key=${toast.id} class="pop pointer-events-auto flex items-center gap-3 max-w-md rounded-2xl bg-ink text-card pl-4 pr-2 py-2 shadow-2xl text-sm font-semibold">
        <span class="py-1">${toast.msg}</span>
        ${toast.undo&&html`<button class="shrink-0 h-8 px-3 rounded-xl font-bold hover:opacity-80" style=${{background:'var(--card)',color:'var(--ink)'}} onClick=${()=>{H.undo();setToast(null);}}>Poništi</button>`}
      </div>
    </div>`}
    ${st.generated&&html`<div id="print-area">${buildExport(st)}</div>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
</script>
</body>
</html>
